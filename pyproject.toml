[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.1",
    "langchain-ollama>=1.1",
    "langchain-core>=1.3",
    "langchain-mcp-adapters>=0.1",
    "duckduckgo-search>=8.0",
    "httpx>=0.25",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.7",
    "numpy>=1.26",
]

[project.scripts]
ollama-agent = "agent.repl:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
